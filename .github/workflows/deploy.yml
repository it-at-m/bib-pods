on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
      - run: cd cori-sdk && npm install
      - run: cd bib-src && npm install
      - run: cd docs && npm install
      - run: cd docs && npm run build
      - run: |
          mkdir -p docs/cori-sdk/definitions docs/bib-src/definitions
          cp cori-sdk/definitions/vocabulary.ttl docs/cori-sdk/definitions/
          cp bib-src/definitions/vocabulary.ttl docs/bib-src/definitions/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
