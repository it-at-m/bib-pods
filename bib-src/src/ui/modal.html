<dialog class="bp-modal" aria-labelledby="bp-modal-title">
    <div class="bp-modal-content">
        <div class="bp-modal-header">
            <h3 id="bp-modal-title">Cockpit</h3>
            <button type="button" class="bp-modal-close">Schließen</button>
        </div>
        <section id="bp-chooser">
            <p>Wo sollen deine Daten gespeichert werden?</p>
            <button id="bp-choose-local-btn" class="button" type="button">Lokal im Browser</button>
            <button id="bp-choose-solid-btn" class="button" type="button">In meinem Solid Pod</button>
        </section>
        <section id="bp-solid-setup" hidden>
            <p>Du hast noch keinen Pod? Optionen findest du <a href="https://solidproject.org/get_a_pod" target="_blank" rel="noopener">hier</a>.</p>
            <div class="bp-solid-connect">
                <input type="url" id="bp-solid-input" placeholder="Provider URL">
                <button id="bp-solid-connect-btn" class="button" type="button">Verbinden</button>
            </div>
            <button id="bp-solid-cancel-btn" class="button" type="button">Zurück</button>
        </section>
        <section id="bp-status" hidden>
            <table id="bp-info-details" class="bp-info-details"></table>

            <button id="bp-check-recommendations-btn" class="button" type="button">Empfehlungen prüfen</button>

            <details id="bp-messages" hidden>
                <summary>Empfehlungen</summary>
                <details id="bp-msg-new-section" open>
                    <summary>Neu</summary>
                    <ul id="bp-msg-new"></ul>
                </details>
                <details id="bp-msg-old-section">
                    <summary>Bereits gesehen</summary>
                    <ul id="bp-msg-old"></ul>
                </details>
            </details>

            <h4 id="bp-profile-heading">Profil</h4>
            <table id="bp-profile-details" class="bp-info-details"></table>

            <div class="bp-actions">
                <button type="button" id="bp-add-triple-btn">Eintrag manuell hinzufügen</button>
                <button type="button" id="bp-download-btn">Profil herunterladen</button>
                <button type="button" id="bp-clear-btn">Profil leeren</button>
            </div>

            <button id="bp-switch-btn" class="button" type="button">Speicherort wechseln</button>
        </section>
    </div>
</dialog>
