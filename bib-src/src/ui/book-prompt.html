<dialog class="bp-modal bp-book-prompt">
    <div class="bp-modal-content">
        <h3 class="bp-book-heading"></h3>
        <p class="bp-book-title"></p>
        <p class="bp-book-fallback" hidden></p>
        <label class="bp-book-option">
            <input type="checkbox" class="bp-book-title-box" checked>
            <span class="bp-book-title-text"></span>
        </label>
        <div class="bp-book-sections"></div>
        <div class="bp-book-actions">
            <button type="button" class="bp-book-cancel button">Abbrechen</button>
            <button type="button" class="bp-book-save button">Speichern</button>
        </div>
    </div>
</dialog>
