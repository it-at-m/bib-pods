<div class="bp-landing">

    <div class="bp-top-blocks">
        <details class="bp-block bp-collapsible bp-intro" open>
            <summary>Intro</summary>
            <p>TODO</p>
        </details>
        <details class="bp-block bp-collapsible bp-howto" open>
            <summary>So funktioniert's</summary>
            <p>TODO</p>
        </details>
        <details class="bp-block bp-collapsible bp-privacy" open>
            <summary>Datenschutz</summary>
            <p>TODO</p>
        </details>
    </div>

    <!-- Logged-out entry: a single "Anmelden" call to action. Clicking it reveals the
         storage chooser below (step two of the login: where should data be stored?). -->
    <section id="bp-login-cta" class="bp-block">
        <button id="bp-anmelden-btn" class="button" type="button">Anmelden</button>
    </section>

    <!-- Step two of the login. Hidden until "Anmelden" is clicked; once a location is
         picked it gives way to the Konto block. Visibility is driven by applyState. -->
    <section id="bp-chooser" class="bp-block" hidden>
        <p>Wo sollen deine Daten gespeichert werden?</p>
        <button id="bp-choose-session-btn" class="button" type="button" title="session storage">Nur in dieser Sitzung</button>
        <button id="bp-choose-local-btn" class="button" type="button" title="local storage">Lokal im Browser</button>
        <button id="bp-choose-solid-btn" class="button" type="button">In meinem Solid Pod</button>
    </section>
    <section id="bp-solid-setup" class="bp-block" hidden>
        <p>Du hast noch keinen Pod? Optionen findest du <a href="https://solidproject.org/get_a_pod" target="_blank" rel="noopener">hier</a>.</p>
        <div class="bp-solid-connect">
            <input type="url" id="bp-solid-input" placeholder="Provider URL">
            <button id="bp-solid-connect-btn" class="button" type="button">Verbinden</button>
        </div>
        <button id="bp-solid-cancel-btn" class="button" type="button">Zurück</button>
    </section>

    <section id="bp-account" class="bp-block bp-when-activated" hidden>
        <p id="bp-storage-label" class="bp-storage-label">
            <span id="bp-storage-label-text"></span>
            <!-- Copies the Merkliste to a world-readable merkliste.ttl beside the profile.
                 Needs a pod's public URL space, so applyState hides it for local/session
                 storage and while a Solid session is interrupted. -->
            <span id="bp-publish" class="bp-publish" hidden>(dev: <a id="bp-publish-link" href="#">publish</a> · <a id="bp-unpublish-link" href="#">unpublish</a>)</span>
        </p>
        <button class="button bp-logout" type="button">Abmelden</button>
    </section>

    <section id="bp-showcase" class="bp-block bp-showcase bp-when-activated" aria-labelledby="bp-showcase-heading" hidden>
        <h3 id="bp-showcase-heading">Schaufenster</h3>
        <div id="bp-strategy-settings">
            <button id="bp-strategy-summary" class="bp-strategy-summary" type="button"
                title="Welche Empfehlungen sollen im Schaufenster erscheinen?"
                aria-haspopup="true" aria-expanded="false"></button>
            <div id="bp-strategy-toggles" class="bp-strategy-popover" hidden></div>
        </div>
        <p><a id="bp-check-recommendations-link" href="#">Empfehlungen prüfen</a></p>
        <div id="bp-lanes" hidden></div>
    </section>

    <section class="bp-block bp-profile bp-when-activated" hidden>
        <cori-profile download-name="bib-pods.ttl"></cori-profile>
    </section>

</div>
