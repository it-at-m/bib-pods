<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>query — bib-pods</title>
        <link rel="stylesheet" href="../styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
        <style>
            .CodeMirror {
                flex: 1;
                min-width: 0;
                height: auto;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 1rem;
                padding: 0.4rem 0.4rem;
            }
            .CodeMirror-focused { border-color: #888; }
            .cm-s-default .cm-field { color: #07a; }
            .cm-s-default .cm-string { color: inherit; }
            .param-label {
                flex: 0 0 8rem;
                line-height: 2.2;
                color: #555;
            }
            .q-row {
                margin-top: 2rem;
            }
            #endpoint {
                color: #888;
            }
            .saved-help {
                font-size: 0.85rem;
                color: #888;
                margin: -0.4rem 0 0.75rem 8.5rem;
                min-height: 1.2em;
            }
            .query-tabs {
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem;
                margin-bottom: 1.5rem;
                border-bottom: 1px solid #ddd;
            }
            .query-tab {
                padding: 0.5rem 0.8rem;
                background: none;
                border: none;
                border-bottom: 2px solid transparent;
                cursor: pointer;
                font: inherit;
                color: #555;
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                margin-bottom: -1px;
            }
            .query-tab.active {
                border-bottom-color: #07a;
                color: #000;
            }
            .query-tab .close {
                color: #aaa;
                padding: 0 0.2rem;
                border-radius: 3px;
            }
            .query-tab .close:hover {
                background: #eee;
                color: #c33;
            }
            .add-tab {
                padding: 0.5rem 0.8rem;
                background: none;
                border: none;
                cursor: pointer;
                font: inherit;
                color: #07a;
            }
            .add-tab:hover {
                text-decoration: underline;
            }
            .tab-label-edit {
                font: inherit;
                border: 1px solid #07a;
                border-radius: 2px;
                padding: 0 0.2rem;
                background: white;
                width: 9rem;
            }
            .reset-tabs {
                margin-left: auto;
                padding: 0.5rem 0.8rem;
                background: none;
                border: none;
                cursor: pointer;
                font: inherit;
                font-size: 0.85rem;
                color: #999;
            }
            .reset-tabs:hover {
                color: #c33;
            }
            .timing {
                font-size: 0.85rem;
                color: #999;
                margin-left: 1rem;
                align-self: center;
            }
        </style>
    </head>
    <body>
        <nav class="top-menu">
            <a href="../index.html">home</a>
            <a href="../vocabulary/">vocabulary</a>
            <a class="brand" href="../query/">query</a>
            <span class="spacer"></span>
            <a href="https://github.com/it-at-m/bib-pods">GitHub</a>
        </nav>
        <main>
            <div class="query-tabs" id="query-tabs"></div>
            <form id="q-form">
                <div class="field-row">
                    <label class="param-label" for="endpoint">endpoint</label>
                    <input id="endpoint" type="url" placeholder="Solr endpoint (will be saved in localStorage)">
                </div>
                <div class="field-row">
                    <label class="param-label" for="saved">saved queries</label>
                    <select id="saved">
                        <option value="">— saved queries —</option>
                    </select>
                </div>
                <p id="saved-help" class="saved-help"></p>
                <div class="field-row q-row">
                    <label class="param-label" for="q">query</label>
                    <textarea id="q" rows="3" placeholder="*:*">*:*</textarea>
                </div>
                <div class="field-row">
                    <label class="param-label" for="fl">fields</label>
                    <input id="fl" type="text" value="*">
                </div>
                <div class="field-row">
                    <label class="param-label" for="rows">rows</label>
                    <input id="rows" type="text" value="10">
                </div>
                <div class="field-row">
                    <label class="param-label" for="params">extra params</label>
                    <textarea id="params" rows="4"></textarea>
                </div>
                <div class="field-row actions">
                    <button type="submit">search</button>
                    <span id="timing" class="timing"></span>
                </div>
            </form>
            <div class="tabs">
                <button type="button" class="tab active" data-mode="raw">raw</button>
                <button type="button" class="tab" data-mode="table">table</button>
            </div>
            <div class="output" data-mode="raw">
                <pre><code id="result" class="language-json">Enter a Solr query above.</code></pre>
            </div>
            <div class="output hidden" data-mode="table">
                <p class="results-meta" id="table-meta">Run a query first.</p>
                <table class="results-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination" hidden>
                <button type="button" id="prev-page">← prev</button>
                <span id="page-info"></span>
                <button type="button" id="next-page">next →</button>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/solr/solr.min.js"></script>
        <script>
            const ENDPOINT_KEY = "bib-pods.solr-endpoint"

            const SAVED_QUERIES = [
                {
                    label: "all documents",
                    description: "Match every document in the index.",
                    q: "*:*",
                },
                {
                    label: "by author",
                    description: "Restrict to documents where the author field contains 'Sapkowski'. The fl param picks which fields come back.",
                    q: "author:Sapkowski",
                    fl: "id,title,author,publishDate,topic",
                },
                {
                    label: "genre + author + keyword",
                    description: "Combine three field constraints with AND — all three must match.",
                    q: "genre:Musikdruck AND author:Weill AND title:Kurt",
                    fl: "id,title,author,publishDate,genre",
                    rows: 10,
                },
                {
                    label: "phrase query",
                    description: "Quoted terms become a phrase: words must appear in order, adjacent.",
                    q: 'title:"Der Herr der Ringe"',
                    fl: "id,title",
                },
                {
                    label: "wildcard match",
                    description: "`*` matches any sequence of characters; `?` matches a single character.",
                    q: "title:Witch*",
                    fl: "id,title,author",
                },
                {
                    label: "fuzzy search (~1 edit)",
                    description: "`~N` after a term allows up to N character edits (insert/delete/substitute/transpose). Tolerates typos.",
                    q: "author:Sapkowski~1",
                    fl: "id,author,title",
                },
                {
                    label: "proximity (within 5 words)",
                    description: "`~N` after a quoted phrase allows the words to be up to N positions apart instead of strictly adjacent.",
                    q: 'title:"Kurt Weill"~5',
                    fl: "id,title",
                },
                {
                    label: "date range (inclusive)",
                    description: "`[a TO b]` is an inclusive range; `{a TO b}` is exclusive. `*` works as an open bound.",
                    q: "publishDate:[2000 TO 2010]",
                    fl: "id,title,publishDate",
                },
                {
                    label: "boosted terms",
                    description: "`^N` boosts the score of matches on that term — useful for ranking when combining alternatives with OR.",
                    q: "title:witcher^3 OR title:wizard",
                    fl: "id,title,score",
                },
                {
                    label: "field grouping",
                    description: "`field:(a OR b)` is shorthand for `(field:a OR field:b)` — applies the field to each term in the group.",
                    q: "topic:(magic OR dragons OR elves)",
                    fl: "id,title,topic",
                },
                {
                    label: "grouped + negated",
                    description: "Parentheses group sub-expressions; `AND NOT` excludes documents matching the right side.",
                    q: "(author:Sapkowski OR author:Weill) AND NOT genre:Musikdruck",
                    fl: "id,title,author,genre",
                },
                {
                    label: "required + prohibited",
                    description: "`+` requires a clause to match; `-` requires it not to match. Alternative to AND/NOT.",
                    q: "+author:Sapkowski -genre:Comic",
                    fl: "id,author,genre",
                },
                {
                    label: "edismax: PDF baseline (recommended)",
                    description: "All PDF recommendations applied at once: qf weights, pf phrase boost, tie blend, AND default, slop tolerances, stopwords off, synonyms on. The 'start here' preset.",
                    q: "Kurt Weill",
                    fl: "*,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title^4 author^2 topic^3\npf=title^10 topic^5\ntie=0.1\nq.op=AND\nps=1\nqs=1\nstopwords=false\nsynonyms=true",
                },
                {
                    label: "edismax: untuned (qf only)",
                    description: "Edismax with the same fields as the baseline but no tuning — uniform weights, no pf/tie/AND/slop/linguistic settings. Flip between this and the baseline to see whether the PDF recommendations actually improve ranking on your data.",
                    q: "Kurt Weill",
                    fl: "*,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title author topic",
                },
                {
                    label: "edismax: weighted fields (qf)",
                    description: "edismax searches free text across multiple fields. `qf` weights each field — title matches count 4×, author 2×, topic 3×. Multi-term q so weighting visibly differentiates ranking.",
                    q: "Kurt Weill",
                    fl: "*,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title^4 author^2 topic^3",
                },
                {
                    label: "edismax: phrase boost (pf)",
                    description: "`pf` rewards documents where the words appear together as a phrase, on top of normal qf scoring. Great for ranking exact phrases higher without requiring them.",
                    q: "Kurt Weill",
                    fl: "*,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title^4 author^2\npf=title^10 topic^5",
                },
                {
                    label: "edismax: tie (multi-field blending)",
                    description: "`tie` blends scores from secondary field matches. 0.0 = take the best field only (disjunction-max); 1.0 = sum all fields. 0.1 nudges multi-field hits up.",
                    q: "magic dragons",
                    fl: "*,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title^4 topic^3\ntie=0.1",
                },
                {
                    label: "edismax: strict AND (q.op)",
                    description: "`q.op=AND` requires every term to match somewhere in the qf fields. Strict — best when the user's intent is precise. Leave `mm` empty under AND.",
                    q: "Kurt Weill",
                    fl: "id,title,author,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title^4 author^2\nq.op=AND",
                },
                {
                    label: "edismax: OR + mm 75%",
                    description: "`q.op=OR` loosens matching; `mm=75%` requires 75% of terms to hit. Balances recall and precision when users type many words.",
                    q: "magic dragons elves wizards",
                    fl: "id,title,topic,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title^4 topic^3\nq.op=OR\nmm=75%",
                },
                {
                    label: "edismax: phrase + query slop (ps/qs)",
                    description: "`ps` allows pf phrase matches with N words between; `qs` does the same for explicit phrase queries. Tolerates slightly out-of-order phrases.",
                    q: "Herr Ringe",
                    fl: "id,title,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title^4\npf=title^10\nps=2\nqs=1",
                },
                {
                    label: "edismax: stopwords + synonyms",
                    description: "Toggle linguistic preprocessing. PDF recommendation: stopwords=false (don't drop them — they may matter in titles), synonyms=true (expand).",
                    q: "Der Herr der Ringe",
                    fl: "id,title,score",
                    rows: 20,
                    params: "defType=edismax\nqf=title^4\nstopwords=false\nsynonyms=true",
                },
            ]

            const form = document.getElementById("q-form")
            const endpointInput = document.getElementById("endpoint")
            const savedSelect = document.getElementById("saved")
            const savedHelp = document.getElementById("saved-help")
            const qTextarea = document.getElementById("q")
            const flInput = document.getElementById("fl")
            const rowsInput = document.getElementById("rows")
            const paramsTextarea = document.getElementById("params")
            const result = document.getElementById("result")
            const tableMeta = document.getElementById("table-meta")
            const tableHead = document.getElementById("table-head")
            const tableBody = document.getElementById("table-body")
            const pagination = document.getElementById("pagination")
            const pageInfo = document.getElementById("page-info")
            const prevBtn = document.getElementById("prev-page")
            const nextBtn = document.getElementById("next-page")
            const timing = document.getElementById("timing")

            const DEFAULT_ROWS = 10
            let currentStart = 0
            let currentRows = DEFAULT_ROWS

            const editor = CodeMirror.fromTextArea(qTextarea, {
                mode: "solr",
                lineWrapping: true,
            })
            editor.focus()

            endpointInput.value = localStorage.getItem(ENDPOINT_KEY) || ""
            endpointInput.addEventListener("input", () => {
                localStorage.setItem(ENDPOINT_KEY, endpointInput.value)
            })

            for (const sq of SAVED_QUERIES) {
                const opt = document.createElement("option")
                opt.value = sq.label
                opt.textContent = sq.label
                savedSelect.appendChild(opt)
            }

            savedSelect.addEventListener("change", () => {
                const sq = SAVED_QUERIES.find(s => s.label === savedSelect.value)
                if (!sq) return
                savedHelp.textContent = sq.description || ""
                editor.setValue(sq.q || "")
                flInput.value = sq.fl || ""
                rowsInput.value = sq.rows || DEFAULT_ROWS
                paramsTextarea.value = sq.params || ""
                if (tabs[activeTabIndex]) {
                    tabs[activeTabIndex].label = sq.label
                    renderTabs()
                    persistTabs()
                }
                editor.focus()
            })

            document.querySelectorAll(".tab").forEach(t => {
                t.addEventListener("click", () => {
                    const mode = t.dataset.mode
                    document.querySelectorAll(".tab").forEach(x => {
                        x.classList.toggle("active", x.dataset.mode === mode)
                    })
                    document.querySelectorAll(".output").forEach(o => {
                        o.classList.toggle("hidden", o.dataset.mode !== mode)
                    })
                    if (tabs[activeTabIndex]) {
                        tabs[activeTabIndex].outputMode = mode
                        persistTabs()
                    }
                })
            })

            function renderTable(data) {
                const docs = data && data.response && data.response.docs ? data.response.docs : []
                const numFound = data && data.response ? data.response.numFound : 0
                tableHead.innerHTML = ""
                tableBody.innerHTML = ""
                if (!docs.length) {
                    tableMeta.textContent = `No documents in response (${numFound} results). Try the raw view.`
                    return
                }
                const HIDDEN = new Set(["_version_", "_root_"])
                const keys = []
                for (const d of docs) for (const k of Object.keys(d)) if (!HIDDEN.has(k) && !keys.includes(k)) keys.push(k)
                tableMeta.textContent = `${numFound} results · showing ${docs.length}`
                const headRow = document.createElement("tr")
                for (const k of keys) {
                    const th = document.createElement("th")
                    th.textContent = k
                    headRow.appendChild(th)
                }
                tableHead.appendChild(headRow)
                for (const d of docs) {
                    const tr = document.createElement("tr")
                    for (const k of keys) {
                        const td = document.createElement("td")
                        const full = formatCell(d[k])
                        if (full.length > 200) {
                            td.textContent = full.slice(0, 200) + "…"
                            td.title = full
                        } else {
                            td.textContent = full
                        }
                        tr.appendChild(td)
                    }
                    tableBody.appendChild(tr)
                }
            }

            function formatCell(v) {
                if (v == null) return ""
                if (Array.isArray(v)) return v.join(", ")
                if (typeof v === "object") return JSON.stringify(v)
                return String(v)
            }

            function updatePagination(data) {
                const numFound = data && data.response ? data.response.numFound : 0
                if (numFound <= currentRows) {
                    pagination.hidden = true
                    return
                }
                const from = currentStart + 1
                const to = Math.min(currentStart + currentRows, numFound)
                pageInfo.textContent = `${from}–${to} of ${numFound} results`
                prevBtn.disabled = currentStart === 0
                nextBtn.disabled = to >= numFound
                pagination.hidden = false
            }

            async function runQuery() {
                const endpoint = endpointInput.value.trim()
                if (!endpoint) {
                    result.textContent = "Set a Solr endpoint first."
                    return
                }
                currentRows = parseInt(rowsInput.value, 10) || DEFAULT_ROWS
                const params = new URLSearchParams()
                params.set("q", editor.getValue().trim() || "*:*")
                const fl = flInput.value.trim()
                if (fl) params.set("fl", fl)
                params.set("rows", currentRows)
                params.set("start", currentStart)
                params.set("wt", "json")
                const extras = paramsTextarea.value.trim()
                if (extras) {
                    for (const line of extras.split("\n")) {
                        const trimmed = line.trim()
                        if (!trimmed) continue
                        const eq = trimmed.indexOf("=")
                        if (eq < 0) continue
                        const key = trimmed.slice(0, eq).trim()
                        const value = trimmed.slice(eq + 1).trim()
                        if (key) params.append(key, value)
                    }
                }
                const url = `${endpoint}?${params.toString()}`
                result.textContent = "Loading…"
                tableMeta.textContent = "Loading…"
                tableHead.innerHTML = ""
                tableBody.innerHTML = ""
                pagination.hidden = true
                timing.textContent = "…"
                const requestStart = performance.now()
                try {
                    const r = await fetch(url)
                    const text = await r.text()
                    let parsed = null
                    try {
                        parsed = JSON.parse(text)
                        result.textContent = JSON.stringify(parsed, null, 2)
                        Prism.highlightElement(result)
                    } catch {
                        result.textContent = text
                    }
                    if (parsed) {
                        renderTable(parsed)
                        updatePagination(parsed)
                    } else {
                        tableMeta.textContent = "Response is not JSON. Try the raw view."
                    }
                } catch (err) {
                    result.textContent = "Request failed: " + err.message
                    tableMeta.textContent = "Request failed."
                } finally {
                    const ms = performance.now() - requestStart
                    timing.textContent = ms < 1000 ? `${Math.round(ms)} ms` : `${(ms / 1000).toFixed(2)} s`
                }
            }

            prevBtn.addEventListener("click", () => {
                currentStart = Math.max(0, currentStart - currentRows)
                runQuery()
            })

            nextBtn.addEventListener("click", () => {
                currentStart = currentStart + currentRows
                runQuery()
            })

            form.addEventListener("submit", (e) => {
                e.preventDefault()
                currentStart = 0
                runQuery()
            })

            const queryTabsEl = document.getElementById("query-tabs")
            const TABS_KEY = "bib-pods.solr-tabs"
            let tabs = []
            let activeTabIndex = 0
            let tabCounter = 0

            function persistTabs() {
                saveActiveTabState()
                const slim = tabs.map(t => {
                    const { rawResult, ...rest } = t
                    return rest
                })
                try {
                    localStorage.setItem(TABS_KEY, JSON.stringify({
                        tabs: slim,
                        activeTabIndex,
                        tabCounter,
                    }))
                } catch {}
            }

            function restoreTabs() {
                try {
                    const raw = localStorage.getItem(TABS_KEY)
                    if (!raw) return false
                    const data = JSON.parse(raw)
                    if (!data || !Array.isArray(data.tabs) || data.tabs.length === 0) return false
                    tabs = data.tabs.map(t => ({
                        ...t,
                        rawResult: "Enter a Solr query above.",
                        endpoint: t.endpoint ?? (localStorage.getItem(ENDPOINT_KEY) || ""),
                    }))
                    activeTabIndex = Math.min(data.activeTabIndex || 0, tabs.length - 1)
                    tabCounter = data.tabCounter || tabs.length
                    return true
                } catch {
                    return false
                }
            }

            function makeNewTab() {
                tabCounter++
                return {
                    id: tabCounter,
                    label: `Query ${tabCounter}`,
                    endpoint: endpointInput.value || localStorage.getItem(ENDPOINT_KEY) || "",
                    q: "*:*",
                    fl: "*",
                    rows: DEFAULT_ROWS,
                    params: "",
                    savedSelection: "",
                    savedHelp: "",
                    rawResult: "Enter a Solr query above.",
                    timing: "",
                    currentStart: 0,
                    currentRows: DEFAULT_ROWS,
                    outputMode: "raw",
                }
            }

            function saveActiveTabState() {
                const t = tabs[activeTabIndex]
                if (!t) return
                t.endpoint = endpointInput.value
                t.q = editor.getValue()
                t.fl = flInput.value
                t.rows = rowsInput.value
                t.params = paramsTextarea.value
                t.savedSelection = savedSelect.value
                t.savedHelp = savedHelp.textContent
                t.rawResult = result.textContent
                t.timing = timing.textContent
                t.currentStart = currentStart
                t.currentRows = currentRows
                const activeOut = document.querySelector(".output:not(.hidden)")
                if (activeOut) t.outputMode = activeOut.dataset.mode
            }

            function loadTabState() {
                const t = tabs[activeTabIndex]
                if (!t) return
                endpointInput.value = t.endpoint || ""
                editor.setValue(t.q)
                flInput.value = t.fl
                rowsInput.value = t.rows
                paramsTextarea.value = t.params
                savedSelect.value = t.savedSelection
                savedHelp.textContent = t.savedHelp || ""
                result.textContent = t.rawResult
                timing.textContent = t.timing || ""
                currentStart = t.currentStart
                currentRows = t.currentRows
                let parsed = null
                try { parsed = JSON.parse(t.rawResult) } catch {}
                if (parsed) {
                    try { Prism.highlightElement(result) } catch {}
                    renderTable(parsed)
                    updatePagination(parsed)
                } else {
                    tableMeta.textContent = "Run a query first."
                    tableHead.innerHTML = ""
                    tableBody.innerHTML = ""
                    pagination.hidden = true
                }
                document.querySelectorAll(".tab").forEach(x => {
                    x.classList.toggle("active", x.dataset.mode === t.outputMode)
                })
                document.querySelectorAll(".output").forEach(o => {
                    o.classList.toggle("hidden", o.dataset.mode !== t.outputMode)
                })
            }

            function renderTabs() {
                queryTabsEl.innerHTML = ""
                tabs.forEach((tab, i) => {
                    const btn = document.createElement("button")
                    btn.type = "button"
                    btn.className = "query-tab" + (i === activeTabIndex ? " active" : "")
                    const labelSpan = document.createElement("span")
                    labelSpan.textContent = tab.label
                    labelSpan.title = "Double-click to rename"
                    labelSpan.addEventListener("dblclick", (e) => {
                        e.stopPropagation()
                        const input = document.createElement("input")
                        input.type = "text"
                        input.value = tab.label
                        input.className = "tab-label-edit"
                        labelSpan.replaceWith(input)
                        input.focus()
                        input.select()
                        let finished = false
                        const finish = (commit) => {
                            if (finished) return
                            finished = true
                            if (commit) {
                                const newLabel = input.value.trim()
                                if (newLabel) tabs[i].label = newLabel
                            }
                            renderTabs()
                            persistTabs()
                        }
                        input.addEventListener("blur", () => finish(true))
                        input.addEventListener("keydown", (ev) => {
                            if (ev.key === "Enter") { ev.preventDefault(); input.blur() }
                            else if (ev.key === "Escape") { ev.preventDefault(); finish(false) }
                        })
                        input.addEventListener("click", (ev) => ev.stopPropagation())
                        input.addEventListener("mousedown", (ev) => ev.stopPropagation())
                    })
                    btn.appendChild(labelSpan)
                    if (tabs.length > 1) {
                        const closeSpan = document.createElement("span")
                        closeSpan.className = "close"
                        closeSpan.textContent = "×"
                        closeSpan.title = "Close tab"
                        closeSpan.addEventListener("click", (e) => {
                            e.stopPropagation()
                            closeTab(i)
                        })
                        btn.appendChild(closeSpan)
                    }
                    btn.addEventListener("click", () => switchTab(i))
                    queryTabsEl.appendChild(btn)
                })
                const addBtn = document.createElement("button")
                addBtn.type = "button"
                addBtn.className = "add-tab"
                addBtn.textContent = "+ new query"
                addBtn.addEventListener("click", addTab)
                queryTabsEl.appendChild(addBtn)
                const resetBtn = document.createElement("button")
                resetBtn.type = "button"
                resetBtn.className = "reset-tabs"
                resetBtn.textContent = "reset"
                resetBtn.title = "Clear all tabs and local storage"
                resetBtn.addEventListener("click", resetAll)
                queryTabsEl.appendChild(resetBtn)
            }

            function resetAll() {
                if (!confirm("Clear all tabs and local storage?")) return
                localStorage.removeItem(TABS_KEY)
                localStorage.removeItem(ENDPOINT_KEY)
                endpointInput.value = ""
                tabs = []
                activeTabIndex = 0
                tabCounter = 0
                tabs.push(makeNewTab())
                loadTabState()
                renderTabs()
            }

            function switchTab(index) {
                if (index === activeTabIndex) return
                saveActiveTabState()
                activeTabIndex = index
                loadTabState()
                renderTabs()
                persistTabs()
            }

            function addTab() {
                saveActiveTabState()
                tabs.push(makeNewTab())
                activeTabIndex = tabs.length - 1
                loadTabState()
                renderTabs()
                persistTabs()
            }

            function closeTab(index) {
                if (tabs.length <= 1) return
                const wasActive = index === activeTabIndex
                tabs.splice(index, 1)
                if (wasActive) {
                    activeTabIndex = Math.min(index, tabs.length - 1)
                    loadTabState()
                } else if (activeTabIndex > index) {
                    activeTabIndex--
                }
                renderTabs()
                persistTabs()
            }

            if (restoreTabs()) {
                loadTabState()
            } else {
                tabs.push(makeNewTab())
            }
            renderTabs()
            window.addEventListener("beforeunload", persistTabs)
        </script>
    </body>
</html>
