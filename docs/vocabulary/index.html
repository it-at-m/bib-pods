<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>vocabulary — bib-pods</title>
        <link rel="stylesheet" href="../styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css">
        <script src="../top-menu.js"></script>
    </head>
    <body>
        <top-menu current="vocabulary"></top-menu>
        <main id="vocab-sections">Loading...</main>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-turtle.min.js"></script>
        <script>
            const SOURCES = [
                {
                    label: "cori-sdk/definitions/vocabulary.ttl",
                    candidates: ["../cori-sdk/definitions/vocabulary.ttl", "../../cori-sdk/definitions/vocabulary.ttl"],
                    repoHref: "https://github.com/it-at-m/bib-pods/blob/main/cori-sdk/definitions/vocabulary.ttl",
                },
                {
                    label: "bib-src/definitions/vocabulary.ttl",
                    candidates: ["../bib-src/definitions/vocabulary.ttl", "../../bib-src/definitions/vocabulary.ttl"],
                    repoHref: "https://github.com/it-at-m/bib-pods/blob/main/bib-src/definitions/vocabulary.ttl",
                },
            ]

            async function fetchFirstOk(candidates) {
                for (const url of candidates) {
                    const r = await fetch(url)
                    if (r.ok) return r.text()
                }
                throw new Error("not found at " + candidates.join(" or "))
            }

            async function renderAll() {
                const main = document.getElementById("vocab-sections")
                main.replaceChildren()
                for (const { label, candidates, repoHref } of SOURCES) {
                    const heading = document.createElement("h3")
                    heading.style.marginTop = "2.5rem"
                    const link = document.createElement("a")
                    link.href = repoHref
                    link.textContent = label
                    heading.appendChild(link)
                    main.appendChild(heading)

                    const pre = document.createElement("pre")
                    const code = document.createElement("code")
                    code.className = "language-turtle"
                    pre.appendChild(code)
                    main.appendChild(pre)

                    try {
                        code.textContent = await fetchFirstOk(candidates)
                        Prism.highlightElement(code)
                    } catch (err) {
                        code.textContent = `Failed to load ${label}: ${err.message}`
                    }
                }
            }

            renderAll()
        </script>
    </body>
</html>
