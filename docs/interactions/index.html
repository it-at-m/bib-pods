<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Interaktionen — bib-pods</title>
        <link rel="stylesheet" href="../styles.css">
        <style>
            main { max-width: 900px; }
            .intro, .trigger { max-width: 54rem; line-height: 1.6; }
            .action h2 { margin: 2rem 0 0.3rem; }
            .action code {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.85em;
                font-weight: normal;
                color: #888;
            }
            .action h2 code { font-size: 0.6em; }
            .trigger { margin: 0; }
            .fields {
                margin: 1rem 0;
                padding: 0.6rem 0.9rem;
                list-style: none;
                background: #fff;
                border: 1px solid #e5e5e5;
                border-radius: 6px;
            }
            .fields li { padding: 0.25rem 0; }
            .box { display: inline-block; width: 1.4em; color: #555; }
        </style>
        <script src="../nav-bar.js"></script>
    </head>
    <body>
        <nav-bar current="interactions"></nav-bar>
        <main>
            <h1>Interaktionen</h1>
            <p class="intro">Welche Profilfelder eine Interaktion ergänzen kann. Erzeugt aus den
                <code>cori:UserAction</code>-Einträgen im Vokabular. Die nicht vorausgewählten Felder
                bietet der Dialog als Folgefragen nur an, wenn der jeweilige Katalogeintrag dazu Angaben
                enthält.</p>
            <div id="actions"></div>
        </main>
        <script type="module">
            import { getUserActions, contractTerm } from "../dist/interactions.js"

            const element = (tag, className, text) => {
                const el = document.createElement(tag)
                if (className) el.className = className
                if (text !== undefined) el.textContent = text
                return el
            }

            const host = document.getElementById("actions")
            const actions = await getUserActions()
            if (actions.length === 0) host.append(element("p", null, "Keine Interaktionen im Vokabular."))
            for (const action of actions) {
                const section = element("section", "action")
                const heading = element("h2", null, action.label + " ")
                heading.append(element("code", null, contractTerm(action.iri)))
                section.append(heading)
                if (action.trigger) section.append(element("p", "trigger", action.trigger))
                // As in the dialog: one checkbox per profile field, pre-ticked where it is there.
                const fields = element("ul", "fields")
                for (const field of action.fields) {
                    const li = element("li")
                    li.append(element("span", "box", field.preselected ? "☑" : "☐"), field.label, " ",
                        element("code", null, contractTerm(field.property)))
                    fields.append(li)
                }
                section.append(fields)
                host.append(section)
            }
        </script>
    </body>
</html>
