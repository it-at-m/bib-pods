# docker compose up -d
# docker compose down
# see all content: http://localhost:9200/interim-index/_search?pretty
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.24@sha256:d6dfe6626d645cfec66e91009aca60c6c1bb6f94d34253528f24d8cea2f94ba6
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      http.cors.enabled: "true"
      http.cors.allow-origin: '"*"'
      http.cors.allow-methods: "GET,POST,PUT,DELETE,OPTIONS,HEAD"
      http.cors.allow-headers: "origin,content-type,accept,authorization"
    volumes:
      - data:/usr/share/elasticsearch/data

volumes:
  data:
