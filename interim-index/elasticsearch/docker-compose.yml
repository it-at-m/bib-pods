# docker compose up -d
# docker compose down
# see all content: http://localhost:9200/interim-index/_search?pretty
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.16@sha256:ac2ab63eabaec668d1b00ceaeeea56fad5919068a3bde40c4ca8f16b3f414e8b
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      http.cors.enabled: "true"
      http.cors.allow-origin: '"*"'
      http.cors.allow-methods: "GET,POST,PUT,DELETE,OPTIONS,HEAD"
      http.cors.allow-headers: "origin,content-type,accept,authorization"
    volumes:
      - data:/usr/share/elasticsearch/data

volumes:
  data:
