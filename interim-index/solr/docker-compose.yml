# docker compose up -d --build
# docker compose down
#
# Solr is bound to 127.0.0.1 so it is reachable only from this host.
# Public access goes through proxy.js (`node proxy.js`), which allowlists
# read-only paths.

services:
  solr:
    build: .
    ports:
      - "127.0.0.1:8983:8983"
    volumes:
      - data:/var/solr
      - ./web.xml:/opt/solr/server/solr-webapp/webapp/WEB-INF/web.xml:ro
    command:
      - solr-precreate
      - interim-index

volumes:
  data:
