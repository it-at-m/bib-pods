<dialog class="bp-modal bp-book-prompt" aria-labelledby="bp-book-modal-title">
    <div class="bp-modal-content">
        <h3 id="bp-book-modal-title">Was gefällt dir an diesem Buch?</h3>
        <p id="bp-book-title" class="bp-book-title"></p>
        <p id="bp-book-fallback" class="bp-book-fallback" hidden></p>
        <label class="bp-book-option">
            <input type="checkbox" id="bp-book-merkliste" checked>
            Zu meiner Merkliste hinzufügen
        </label>
        <div id="bp-book-sections"></div>
        <div class="bp-book-actions">
            <button type="button" id="bp-book-cancel" class="button">Abbrechen</button>
            <button type="button" id="bp-book-save" class="button">Speichern</button>
        </div>
    </div>
</dialog>
